<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 智能工坊 · 修复版</title>
    <style>
        /* ========== CSS 变量（深色/浅色） ========== */
        :root {
            --bg-body: #f1f5f9; --bg-card: #ffffff; --bg-card-hover: #f8fafc; --bg-input: #fafcff; --bg-memory: #f8fafc;
            --bg-block: #f8fafc; --bg-agent: #0f172a; --text-primary: #0f172a; --text-secondary: #334155; --text-muted: #94a3b8;
            --text-white: #ffffff; --border-light: #e2e8f0; --border-focus: #3b82f6; --shadow-card: 0 4px 16px rgba(0,0,0,0.04);
            --shadow-btn: 0 8px 20px rgba(15,23,42,0.15); --tag-bg: #eef2ff; --tag-text: #4338ca; --toolbar-bg: #ffffff;
            --badge-bg: #f1f5f9; --block-border: #d1d9e6; --wf-step-bg: #f8fafc; --wf-step-border: #e2e8f0;
            --modal-overlay: rgba(0,0,0,0.5); --history-item-bg: #f8fafc;
        }
        [data-theme="dark"] {
            --bg-body: #0f172a; --bg-card: #1e293b; --bg-card-hover: #2d3a4f; --bg-input: #2d3a4f; --bg-memory: #2d3a4f;
            --bg-block: #2d3a4f; --bg-agent: #0f172a; --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #94a3b8;
            --text-white: #ffffff; --border-light: #334155; --border-focus: #3b82f6; --shadow-card: 0 4px 16px rgba(0,0,0,0.3);
            --shadow-btn: 0 8px 20px rgba(0,0,0,0.5); --tag-bg: #1e293b; --tag-text: #93c5fd; --toolbar-bg: #1e293b;
            --badge-bg: #334155; --block-border: #475569; --wf-step-bg: #2d3a4f; --wf-step-border: #475569;
            --modal-overlay: rgba(0,0,0,0.7); --history-item-bg: #2d3a4f;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        body { background:var(--bg-body); min-height:100vh; padding:20px; display:flex; justify-content:center; transition:background 0.3s,color 0.3s; color:var(--text-primary); }
        .container { max-width:1460px; width:100%; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
        .header h1 { font-size:26px; font-weight:700; background:linear-gradient(135deg,#0f172a,#3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .header-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .btn-sm { padding:5px 14px; font-size:13px; border-radius:30px; background:var(--badge-bg); border:1px solid var(--border-light); cursor:pointer; transition:0.15s; color:var(--text-secondary); }
        .btn-sm:hover { background:var(--bg-card-hover); }
        .btn-sm.primary-sm { background:#0f172a; color:white; border-color:#0f172a; }
        .btn-sm.danger { background:#fee2e2; color:#dc2626; border-color:#fecaca; }
        .btn-primary { background:#0f172a; color:white; border:none; padding:11px 26px; border-radius:40px; font-weight:600; font-size:15px; cursor:pointer; transition:0.15s; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
        .btn-primary:hover { background:#1e293b; transform:scale(1.01); box-shadow:var(--shadow-btn); }
        .btn-secondary { background:var(--bg-card); color:var(--text-primary); border:1.5px solid var(--border-light); padding:11px 22px; border-radius:40px; font-weight:600; font-size:15px; cursor:pointer; transition:0.15s; }
        .btn-secondary:hover { background:var(--bg-card-hover); border-color:var(--text-muted); }
        .tabs { display:flex; gap:4px; background:var(--toolbar-bg); padding:4px; border-radius:40px; border:1px solid var(--border-light); flex-wrap:wrap; }
        .tab-btn { border:none; background:transparent; padding:8px 18px; border-radius:30px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; transition:0.15s; }
        .tab-btn.active-tab { background:#0f172a; color:white; }
        .tab-btn:hover:not(.active-tab) { background:var(--bg-card-hover); }
        .badge-save { font-size:12px; color:var(--text-muted); background:var(--badge-bg); padding:4px 14px; border-radius:30px; }
        .memory-collapse { background:var(--bg-memory); border-radius:16px; border:1px solid var(--border-light); margin-bottom:18px; padding:0 16px; }
        .memory-collapse summary { padding:12px 0; font-weight:600; font-size:14px; color:var(--text-primary); cursor:pointer; display:flex; align-items:center; gap:8px; }
        .memory-collapse .form-group { margin-bottom:12px; }
        .memory-collapse .form-group:last-child { margin-bottom:16px; }
        .memory-collapse input, .memory-collapse textarea { width:100%; padding:8px 12px; border:1.5px solid var(--border-light); border-radius:10px; font-size:13px; background:var(--bg-input); color:var(--text-primary); }
        .memory-collapse input:focus, .memory-collapse textarea:focus { outline:none; border-color:var(--border-focus); }
        .grid { display:grid; grid-template-columns:1.2fr 0.8fr; gap:26px; align-items:start; }
        .card { background:var(--bg-card); border-radius:24px; padding:26px 28px; box-shadow:var(--shadow-card); border:1px solid var(--border-light); transition:background 0.3s,border 0.3s; }
        .card-title { font-size:16px; font-weight:600; color:var(--text-primary); margin-bottom:16px; border-bottom:2px solid var(--border-light); padding-bottom:12px; display:flex; align-items:center; gap:8px; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:3px; }
        .form-group label small { font-weight:400; color:var(--text-muted); font-size:12px; }
        .form-group input, .form-group textarea, .form-group select { width:100%; padding:10px 14px; border:1.5px solid var(--border-light); border-radius:12px; font-size:14px; background:var(--bg-input); transition:0.2s; color:var(--text-primary); }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline:none; border-color:var(--border-focus); background:var(--bg-card); box-shadow:0 0 0 4px rgba(59,130,246,0.08); }
        .form-group textarea { min-height:56px; resize:vertical; }
        .form-group textarea.small { min-height:40px; }
        .row-2col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .action-row { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
        .action-row .btn-primary { flex:1; min-width:120px; }
        .agent-card { background:var(--bg-agent); border-radius:18px; padding:16px 22px; color:#e2e8f0; margin-bottom:20px; border:1px solid #334155; }
        .agent-card .label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#94a3b8; font-weight:600; }
        .agent-identity { font-size:20px; font-weight:700; color:white; margin:3px 0 2px; }
        .agent-desc { color:#94a3b8; font-size:14px; border-top:1px solid #1e293b; padding-top:8px; margin-top:5px; }
        .output-box { background:var(--bg-card); border-radius:18px; border:1px solid var(--border-light); overflow:hidden; }
        .output-header { display:flex; justify-content:space-between; align-items:center; padding:12px 22px; border-bottom:1px solid var(--border-light); flex-wrap:wrap; gap:8px; }
        .output-header h3 { font-size:14px; color:var(--text-primary); }
        .output-tools { display:flex; gap:6px; flex-wrap:wrap; }
        #promptDisplay { padding:22px; font-size:14px; line-height:1.8; white-space:pre-wrap; word-break:break-word; max-height:460px; overflow-y:auto; color:var(--text-primary); background:var(--bg-input); transition:background 0.3s; }
        #promptDisplay:empty::before { content:'👆 填写左侧参数，点击生成'; color:var(--text-muted); font-style:italic; }
        .char-counter { padding:6px 22px 12px; text-align:right; font-size:12px; color:var(--text-muted); border-top:1px solid var(--border-light); display:flex; justify-content:space-between; align-items:center; }
        .tab-panel { display:none; }
        .tab-panel.active-panel { display:block; }
        .strategy-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
        .strategy-grid .btn-sm { background:var(--bg-card-hover); border-color:var(--border-light); }
        .strategy-grid .btn-sm.active-strategy { background:#0f172a; color:white; border-color:#0f172a; }
        .wf-step-container { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
        .wf-step-item { display:flex; gap:10px; align-items:stretch; background:var(--wf-step-bg); padding:10px 14px; border-radius:12px; border:1px solid var(--wf-step-border); flex-wrap:wrap; }
        .wf-step-item .step-main { flex:3; display:flex; flex-direction:column; gap:4px; min-width:180px; }
        .wf-step-item .step-main input, .wf-step-item .step-main textarea { width:100%; padding:6px 10px; border:1.5px solid var(--border-light); border-radius:8px; font-size:13px; background:var(--bg-input); color:var(--text-primary); font-family:inherit; }
        .wf-step-item .step-main textarea { min-height:44px; resize:vertical; }
        .wf-step-item .step-tool-select { flex:1; min-width:130px; padding:6px 10px; border:1.5px solid var(--border-light); border-radius:8px; font-size:13px; background:var(--bg-input); color:var(--text-primary); }
        .wf-mindmap { display:flex; flex-direction:column; gap:12px; margin-top:16px; padding:10px 0; }
        .wf-mindmap .mm-node { display:flex; align-items:center; gap:16px; background:var(--bg-card); border-radius:12px; padding:12px 18px; border:2px solid var(--border-light); box-shadow:var(--shadow-card); cursor:pointer; transition:0.15s; }
        .wf-mindmap .mm-node:hover { border-color:var(--border-focus); transform:translateX(4px); }
        .wf-mindmap .mm-node .mm-index { font-weight:700; font-size:16px; color:var(--text-muted); min-width:30px; }
        .wf-mindmap .mm-node .mm-content { flex:1; }
        .wf-mindmap .mm-node .mm-content .mm-name { font-weight:600; font-size:15px; color:var(--text-primary); }
        .wf-mindmap .mm-node .mm-content .mm-tool { font-size:13px; color:var(--text-muted); }
        .wf-mindmap .mm-node .mm-arrow { font-size:20px; color:var(--text-muted); }
        .wf-mindmap .mm-connector { width:2px; height:20px; background:var(--text-muted); margin:0 auto; opacity:0.5; }
        .kb-container { display:flex; gap:20px; min-height:300px; }
        .kb-folders { width:200px; border-right:1px solid var(--border-light); padding-right:16px; flex-shrink:0; }
        .kb-folders .folder-item { padding:8px 12px; border-radius:8px; cursor:pointer; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; background:var(--bg-card-hover); border:1px solid transparent; }
        .kb-folders .folder-item.active { border-color:var(--border-focus); background:var(--bg-input); }
        .kb-folders .folder-item:hover { background:var(--bg-input); }
        .kb-docs { flex:1; min-width:0; }
        .kb-doc-item { padding:10px 14px; border-radius:8px; background:var(--bg-card-hover); margin-bottom:8px; border:1px solid var(--border-light); cursor:pointer; transition:0.1s; }
        .kb-doc-item:hover { border-color:var(--border-focus); }
        .kb-doc-item .doc-title { font-weight:600; color:var(--text-primary); }
        .kb-doc-item .doc-meta { font-size:12px; color:var(--text-muted); margin-top:4px; }
        .kb-editor { margin-top:16px; border-top:1px solid var(--border-light); padding-top:16px; }
        .history-modal { display:none; position:fixed; inset:0; background:var(--modal-overlay); backdrop-filter:blur(4px); z-index:999; justify-content:center; align-items:center; }
        .history-modal.open { display:flex; }
        .history-panel { background:var(--bg-card); border-radius:24px; max-width:600px; width:90%; max-height:80vh; padding:24px; box-shadow:0 30px 60px rgba(0,0,0,0.3); display:flex; flex-direction:column; }
        .history-panel h3 { font-size:18px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; color:var(--text-primary); }
        .history-panel h3 button { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-muted); }
        .history-list { overflow-y:auto; flex:1; }
        .history-item { padding:12px 16px; background:var(--history-item-bg); border-radius:12px; margin-bottom:8px; border-left:4px solid var(--border-focus); cursor:pointer; transition:0.1s; color:var(--text-primary); }
        .history-item:hover { background:var(--bg-card-hover); }
        .history-item .h-time { font-size:11px; color:var(--text-muted); }
        .history-item .h-preview { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .history-empty { color:var(--text-muted); text-align:center; padding:40px 0; }
        .hidden-file-input { display:none; }
        @media (max-width:1000px) { .grid { grid-template-columns:1fr; } .row-2col { grid-template-columns:1fr; } .kb-container { flex-direction:column; } .kb-folders { width:100%; border-right:none; padding-right:0; display:flex; flex-wrap:wrap; gap:8px; } .kb-folders .folder-item { flex:0 0 auto; margin-bottom:0; } }
        @media (max-width:480px) { .card { padding:16px; } .action-row { flex-direction:column; } .action-row .btn-primary { width:100%; } .tabs { width:100%; justify-content:center; } .tab-btn { padding:5px 12px; font-size:12px; } .wf-step-item { flex-direction:column; } .wf-step-item .step-tool-select { width:100%; } .header h1 { font-size:20px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚙️ 智能工坊 · 修复版</h1>
        <div class="header-actions">
            <button class="btn-sm" onclick="toggleTheme()" id="themeToggle">🌙 深色</button>
            <button class="btn-sm" onclick="exportData()">📤 导出配置</button>
            <button class="btn-sm" onclick="document.getElementById('importFileInput').click()">📥 导入配置</button>
            <input type="file" id="importFileInput" class="hidden-file-input" accept=".json" onchange="importData(event)">
            <div class="tabs">
                <button class="tab-btn active-tab" data-tab="prompt">🧠 提示词</button>
                <button class="tab-btn" data-tab="paper">📚 论文</button>
                <button class="tab-btn" data-tab="strategy">📊 策略</button>
                <button class="tab-btn" data-tab="mbti">🍸 MBTI</button>
                <button class="tab-btn" data-tab="workflow">🔗 工作流</button>
                <button class="tab-btn" data-tab="knowledge">📚 知识库</button>
            </div>
            <span class="badge-save">💾 自动记忆</span>
        </div>
    </div>
    <details class="memory-collapse" id="globalMemoryToggle">
        <summary>🧠 全局记忆设置（默认角色 / 风格偏好）</summary>
        <div class="form-group"><label>🎭 默认专家角色</label><input type="text" id="globalRole" placeholder="例：资深产品经理" /></div>
        <div class="form-group"><label>🎨 默认语气/风格</label><textarea id="globalTone" placeholder="例：专业、数据驱动"></textarea></div>
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">💡 设置后，每次生成都会自动带上这些偏好。</div>
    </details>
    <div class="grid">
        <div class="card">
            <!-- 提示词 -->
            <div id="panel-prompt" class="tab-panel active-panel">
                <div class="card-title">📋 配置智能体</div>
                <div style="margin-bottom:14px; display:flex; flex-wrap:wrap; gap:6px;">
                    <button class="btn-sm" data-preset="xiaohongshu">📕小红书</button>
                    <button class="btn-sm" data-preset="wechat">📰公众号</button>
                    <button class="btn-sm" data-preset="python">🐍Python</button>
                    <button class="btn-sm" data-preset="report">📊周报</button>
                    <button class="btn-sm" onclick="clearPromptForm()" style="color:#ef4444;">✕清空</button>
                </div>
                <div class="form-group"><label>🎭 角色设定</label><input type="text" id="pRole" placeholder="例：资深美妆博主" /></div>
                <div class="form-group"><label>🎯 核心任务</label><textarea id="pTask" class="small" placeholder="例：写一篇推荐入门护肤品的笔记"></textarea></div>
                <div class="form-group"><label>📌 背景信息</label><textarea id="pBg" placeholder="例：受众20-25岁学生党"></textarea></div>
                <div class="form-group"><label>⚙️ 具体要求</label><textarea id="pReq" placeholder="例：活泼风格，300字"></textarea></div>
                <div class="form-group"><label>📎 参考示例</label><textarea id="pExample" class="small" placeholder="可选"></textarea></div>
                <div class="action-row"><button class="btn-primary" onclick="genPrompt()">✨ 生成提示词</button><button class="btn-secondary" onclick="copyOutput()">📋 复制</button></div>
            </div>
            <!-- 论文 -->
            <div id="panel-paper" class="tab-panel">
                <div class="card-title">📚 论文生成 + 文献管理</div>
                <div class="form-group"><label>📝 论文题目</label><input type="text" id="paperTitle" placeholder="例：人工智能对高等教育的变革研究" /></div>
                <div class="row-2col">
                    <div class="form-group"><label>🏷️ 关键词</label><input type="text" id="paperKeywords" placeholder="AI, 教育" /></div>
                    <div class="form-group"><label>🏛️ 院系</label><input type="text" id="paperDept" placeholder="计算机学院" /></div>
                </div>
                <div class="row-2col">
                    <div class="form-group"><label>📏 字数</label><select id="paperWords"><option value="3000">3000字</option><option value="5000" selected>5000字</option><option value="8000">8000字</option></select></div>
                    <div class="form-group"><label>🎯 风格</label><select id="paperStyle"><option value="academic">严谨学术型</option><option value="applied" selected>应用实证型</option></select></div>
                </div>
                <div class="form-group"><label>📚 参考文献 (每行一条)</label><textarea id="paperRefs" class="small" placeholder="Smith, J. (2020). AI in Education."></textarea></div>
                <div class="form-group"><label>📌 额外要求</label><textarea id="paperExtra" class="small" placeholder="可选"></textarea></div>
                <div class="action-row"><button class="btn-primary" onclick="genPaper()">🚀 生成论文</button><button class="btn-secondary" onclick="copyOutput()">📋 复制</button><button class="btn-secondary" onclick="exportMarkdown()">⬇️ 导出MD</button></div>
            </div>
            <!-- 策略 -->
            <div id="panel-strategy" class="tab-panel">
                <div class="card-title">📊 商业与策略模板</div>
                <div class="strategy-grid">
                    <button class="btn-sm active-strategy" data-strategy="swot">📈 SWOT分析</button>
                    <button class="btn-sm" data-strategy="prd">📋 PRD</button>
                    <button class="btn-sm" data-strategy="retro">🔄 项目复盘</button>
                </div>
                <div class="form-group"><label>🎯 项目名称</label><input type="text" id="sTitle" placeholder="例：在线协作白板" /></div>
                <div class="form-group"><label>📌 背景/痛点</label><textarea id="sBg" class="small" placeholder="例：竞品有Miro，我们的优势是集成飞书"></textarea></div>
                <div class="form-group"><label>📎 额外备注</label><textarea id="sExtra" class="small" placeholder="可选"></textarea></div>
                <div class="action-row"><button class="btn-primary" onclick="genStrategy()">🧠 生成文档</button><button class="btn-secondary" onclick="copyOutput()">📋 复制</button></div>
            </div>
            <!-- MBTI -->
            <div id="panel-mbti" class="tab-panel">
                <div class="card-title">🍸 MBTI人格调酒 · 专属特调</div>
                <div class="form-group"><label>🧬 人格类型</label>
                    <select id="mbtiType">
                        <option value="INTJ">INTJ · 建筑师</option><option value="INTP">INTP · 逻辑学家</option>
                        <option value="ENTJ">ENTJ · 指挥官</option><option value="ENTP">ENTP · 辩论家</option>
                        <option value="INFJ">INFJ · 提倡者</option><option value="INFP">INFP · 调停者</option>
                        <option value="ENFJ">ENFJ · 主人公</option><option value="ENFP">ENFP · 竞选者</option>
                        <option value="ISTJ">ISTJ · 物流师</option><option value="ISFJ">ISFJ · 守卫者</option>
                        <option value="ESTJ">ESTJ · 总经理</option><option value="ESFJ">ESFJ · 执政官</option>
                        <option value="ISTP">ISTP · 鉴赏家</option><option value="ISFP">ISFP · 探险家</option>
                        <option value="ESTP">ESTP · 企业家</option><option value="ESFP">ESFP · 表演者</option>
                    </select>
                </div>
                <div class="row-2col">
                    <div class="form-group"><label>🍭 口味偏好</label><select id="mbtiFlavor"><option value="sweet">酸甜/果味</option><option value="bitter" selected>苦烈/干型</option><option value="fresh">清爽/草本</option><option value="spicy">辛辣/烟熏</option></select></div>
                    <div class="form-group"><label>🍷 酒精度</label><select id="mbtiAbv"><option value="low">低度数</option><option value="medium" selected>中高度</option><option value="high">高度数</option></select></div>
                </div>
                <div class="form-group"><label>📝 场合/心情</label><input type="text" id="mbtiOccasion" placeholder="例：深夜独处、朋友派对..." /></div>
                <div class="action-row"><button class="btn-primary" onclick="genMBTI()">🍸 生成酒谱</button><button class="btn-secondary" onclick="copyOutput()">📋 复制</button></div>
            </div>
            <!-- 工作流 -->
            <div id="panel-workflow" class="tab-panel">
                <div class="card-title">🔗 工作流编排 · 详细指令版</div>
                <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
                    <button class="btn-sm" onclick="loadWorkflowTemplate('app')">📱 App开发</button>

function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️ 亮色' : '🌙 深色';
    localStorage.setItem('theme', next);
}
function loadTheme() {
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️ 亮色' : '🌙 深色';
}
loadTheme();

// ================================================================
// 4. 历史记录
// ================================================================
function loadHistory() {
    const raw = localStorage.getItem('genHistory');
    if (raw) { try { historyData = JSON.parse(raw); } catch(e) { historyData = []; } } else historyData = [];
}
function saveHistory(content, mode) {
    if (!content || content.length < 10) return;
    const preview = content.replace(/\n/g,' ').substring(0,120);
    historyData.unshift({ id:Date.now(), mode, preview, fullText:content, time:new Date().toLocaleString() });
    if (historyData.length > 50) historyData = historyData.slice(0,50);
    localStorage.setItem('genHistory', JSON.stringify(historyData));
}
function openHistory() {
    const modal = document.getElementById('historyModal');
    const list = document.getElementById('historyList');
    if (historyData.length===0) list.innerHTML='<div class="history-empty">暂无历史记录。</div>';
    else list.innerHTML = historyData.map((item,idx)=>`
        <div class="history-item" onclick="restoreHistory(${idx})">
            <div class="h-time">${item.time} · ${item.mode}</div>
            <div class="h-preview">${item.preview}</div>
        </div>
    `).join('');
    modal.classList.add('open');
}
function closeHistory() { document.getElementById('historyModal').classList.remove('open'); }
function restoreHistory(index) {
    const item = historyData[index];
    if (item) { display.innerHTML = item.fullText; currentOutput = item.fullText; charCount.textContent = item.fullText.length+' 字符'; closeHistory(); }
}
function clearHistory() { if(confirm('确定清空所有历史记录吗？')){ historyData=[]; localStorage.removeItem('genHistory'); openHistory(); } }
document.getElementById('historyModal').addEventListener('click', function(e){ if(e.target===this) closeHistory(); });

function clearPromptForm() { ['pRole','pTask','pBg','pReq','pExample'].forEach(id=>document.getElementById(id).value=''); savePromptLocal(); genPrompt(); }
function genPrompt() {
    let r = '';
    const finalRole = pRole.value.trim() || globalRole.value.trim();
    if (finalRole) r += `> **角色设定**：${finalRole}\n\n`;
    if (pTask.value.trim()) r += `> **核心任务**：${pTask.value.trim()}\n\n`;
    if (pBg.value.trim()) r += `> **背景信息**：${pBg.value.trim()}\n\n`;
    if (pReq.value.trim()) r += `> **具体要求**：${pReq.value.trim()}\n\n`;
    if (pExample.value.trim()) r += `> **参考示例**：${pExample.value.trim()}`;
    if (globalTone.value.trim() && r) r += `\n\n> **全局风格**：${globalTone.value.trim()}`;
    if (!r) { display.innerHTML = '⚠️ 请填写字段或选择预设。'; charCount.textContent = '0 字符'; currentOutput = ''; return; }
    display.innerHTML = r; currentOutput = r; charCount.textContent = r.length+' 字符';
    savePromptLocal(); saveHistory(r, '提示词');
}
function savePromptLocal() {

function genPaper() {
    const title = paperTitle.value.trim();
    if (!title) { display.innerHTML = '⚠️ 请输入论文题目。'; charCount.textContent = '0 字符'; currentOutput = ''; return; }
    const refsRaw = paperRefs.value.trim().split('\n').filter(r=>r.trim());
    const style = paperStyle.value;
    const tone = globalTone.value.trim();
    let full = `# ${title}\n\n**摘要**：聚焦“${title}”。\n\n## 1. 引言\n## 2. 文献综述\n`;
    if (refsRaw.length > 0) full += refsRaw.map((r,i)=>`${i+1}. ${r}`).join('\n');
    full += `\n\n## 3. 方法论 (${style})\n## 4. 讨论\n## 5. 结论\n\n## 参考文献\n`;
    if (tone) full = `🎨 风格：${tone}\n\n` + full;
    full += `\n\n> 当前约 ${full.length} 字符。`;
    display.innerHTML = full; currentOutput = full; charCount.textContent = full.length+' 字符';
    savePaperLocal(); saveHistory(full, '论文');
}
function savePaperLocal() {
    localStorage.setItem('paperForm', JSON.stringify({title:paperTitle.value, keywords:paperKeywords.value, dept:paperDept.value, words:paperWords.value, style:paperStyle.value, refs:paperRefs.value, extra:paperExtra.value}));

function loadKB() {
    const raw = localStorage.getItem('knowledgeBase');
    if (raw) { try { kbData = JSON.parse(raw); } catch(e) { kbData = { folders:[], docs:[] }; } } else { kbData = { folders:[], docs:[] }; }
    if (!kbData.folders) kbData.folders = [];
    if (!kbData.docs) kbData.docs = [];
    if (kbData.folders.length === 0) kbData.folders.push({ id:'default', name:'默认' });
    selectedFolderId = kbData.folders[0].id;
    renderKB();
}
function saveKB() { localStorage.setItem('knowledgeBase', JSON.stringify(kbData)); }
function renderKB() {
    const folderList = document.getElementById('kbFolderList');
    folderList.innerHTML = kbData.folders.map(f => `
        <div class="folder-item ${f.id === selectedFolderId ? 'active' : ''}" onclick="selectFolder('${f.id}')">
            <span>📁 ${f.name}</span>
            <span style="cursor:pointer; color:var(--text-muted);" onclick="event.stopPropagation(); deleteFolder('${f.id}')">✕</span>
        </div>
    `).join('');
    const docs = kbData.docs.filter(d => d.folderId === selectedFolderId);
    const docList = document.getElementById('kbDocList');
    if (docs.length === 0) docList.innerHTML = '<div style="color:var(--text-muted); padding:20px 0; text-align:center;">此文件夹暂无文档</div>';
    else {
        docList.innerHTML = docs.map(d => `
            <div class="kb-doc-item" onclick="editDoc('${d.id}')">
                <div class="doc-title">${d.title || '无标题'}</div>
                <div class="doc-meta">${d.tags ? '🏷️ '+d.tags : ''} ${d.link ? '🔗 '+d.link : ''}</div>
            </div>
        `).join('');
    }
    if (editingDocId) {
        const doc = kbData.docs.find(d => d.id === editingDocId);
        if (doc) {
            document.getElementById('kbDocTitle').value = doc.title || '';
            document.getElementById('kbDocContent').value = doc.content || '';
            document.getElementById('kbDocTags').value = doc.tags || '';
            document.getElementById('kbDocLink').value = doc.link || '';
            document.getElementById('kbEditor').style.display = 'block';
        } else cancelDocEdit();
    } else document.getElementById('kbEditor').style.display = 'none';
}
function selectFolder(id) { selectedFolderId = id; cancelDocEdit(); renderKB(); }
function addFolder() {
    const name = prompt('请输入文件夹名称：');
    if (name && name.trim()) { kbData.folders.push({ id:Date.now()+'_'+Math.random().toString(36).slice(2,6), name:name.trim() }); saveKB(); renderKB(); }
}
function deleteFolder(id) {
    if (confirm('确定删除此文件夹及其所有文档吗？')) {
        kbData.folders = kbData.folders.filter(f=>f.id!==id);
        kbData.docs = kbData.docs.filter(d=>d.folderId!==id);
        if (selectedFolderId === id) selectedFolderId = kbData.folders.length>0 ? kbData.folders[0].id : null;
        saveKB(); renderKB();
    }
}
function addDoc() {
    if (!selectedFolderId) { alert('请先选择一个文件夹。'); return; }
    const newDoc = { id:Date.now()+'_'+Math.random().toString(36).slice(2,6), folderId:selectedFolderId, title:'新文档', content:'', tags:'', link:'', createdAt:new Date().toISOString() };
    kbData.docs.push(newDoc); saveKB(); editDoc(newDoc.id);
}
function editDoc(id) { editingDocId = id; renderKB(); }
function saveDoc() {
    if (!editingDocId) return;
    const doc = kbData.docs.find(d=>d.id===editingDocId);
    if (doc) {
        doc.title = document.getElementById('kbDocTitle').value.trim() || '无标题';
        doc.content = document.getElementById('kbDocContent').value;
        doc.tags = document.getElementById('kbDocTags').value.trim();
        doc.link = document.getElementById('kbDocLink').value.trim();
        saveKB(); renderKB();
    }
}
function deleteDoc() {
    if (!editingDocId) return;
    if (confirm('确定删除此文档吗？')) { kbData.docs = kbData.docs.filter(d=>d.id!==editingDocId); editingDocId = null; saveKB(); renderKB(); }
}
function cancelDocEdit() { editingDocId = null; renderKB(); }

function exportData() {
    const keys = ['promptForm','paperForm','strategyForm','workflowData','genHistory','globalMemory','knowledgeBase','theme'];
    const data = {};
    keys.forEach(k => { const val = localStorage.getItem(k); if (val !== null) data[k] = val; });

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agent_workbench_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
}
function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            for (const [key, value] of Object.entries(data)) localStorage.setItem(key, value);
            alert('✅ 导入成功！页面将刷新以应用新数据。');
            location.reload();
        } catch(err) { alert('❌ 导入失败：文件格式错误。'); }
    };
    reader.readAsText(file);
    event.target.value = '';
}
